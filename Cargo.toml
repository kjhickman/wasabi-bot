[package]
name = "wasabi-bot"
version = "0.1.0"
edition = "2024"
default-run = "wasabi-bot"
description = "A Discord bot with music playback and a web dashboard"
license = "MIT"
repository = "https://github.com/kjhickman/wasabi-bot"
readme = "README.md"
keywords = ["discord", "bot", "music"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
base64 = "0.23"
futures-util = "0.3"
ring = "0.17"
lavalink-rs = { version = "0.15", features = ["songbird"] }
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "logs", "tls-ring"] }
opentelemetry_sdk = "0.32"
poise = "0.6"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songbird = { version = "0.5", default-features = false, features = ["gateway", "rustls", "serenity"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "time", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
topcoat = { version = "0.5", features = ["tailwind", "ui", "icon-iconify", "sse"] }

[build-dependencies]
topcoat = { version = "0.5", default-features = false, features = ["tailwind", "icon-iconify"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15", features = ["postgres"] }
