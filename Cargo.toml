[package]
name = "wasabi-bot"
version = "0.1.0"
edition = "2024"
default-run = "wasabi-bot"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
lavalink-rs = { version = "0.15", features = ["songbird"] }
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "logs", "tls-ring"] }
opentelemetry_sdk = "0.32"
poise = "0.6"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songbird = { version = "0.5", default-features = false, features = ["gateway", "rustls", "serenity"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "time", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15", features = ["postgres"] }
