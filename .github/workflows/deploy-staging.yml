name: Deploy Staging

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "migrations/**"
      - "lavalink/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "fly.db.toml"
      - "fly.staging.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  lavalink:
    needs: tests
    uses: ./.github/workflows/deploy-lavalink.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      LAVALINK_PASSWORD: ${{ secrets.LAVALINK_PASSWORD }}

  deploy:
    needs: tests
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      fly-app: wasabi-bot-staging
      fly-config: fly.staging.toml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
