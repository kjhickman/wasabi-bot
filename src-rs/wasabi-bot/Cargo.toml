[package]
name = "wasabi-bot"
version = "0.1.0"
edition = "2024"
default-run = "wasabi-bot"

[dependencies]
anyhow = "1"
axum = "0.8"
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "logs", "tls-ring"] }
opentelemetry_sdk = "0.32"
poise = "0.6"
rand = "0.9"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "time", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
testcontainers-modules = { version = "0.13", features = ["postgres"] }
